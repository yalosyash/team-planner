<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Планировщик загрузки команды</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span class="brand-title">Планировщик загрузки команды</span>
        <span class="team-wrap" id="teamWrap"></span>
      </div>
      <div class="actions">
        <span id="storeStatus" class="store" title="Где хранятся данные"
          >проверка…</span
        >
        <button id="btnPeople">Сотрудники</button>
        <button id="btnAddTask" class="primary">+ Задача</button>
        <button id="btnExport" title="Сохранить данные в файл">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 10.5V2.5M8 2.5 5 5.5M8 2.5l3 3M3 10.5v2.3c0 .4.3.7.7.7h8.6c.4 0 .7-.3.7-.7v-2.3"
            />
          </svg>
          Экспорт
        </button>
        <button id="btnImport" title="Загрузить данные из файла">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 2.5v8M8 10.5 5 7.5M8 10.5l3-3M3 10.5v2.3c0 .4.3.7.7.7h8.6c.4 0 .7-.3.7-.7v-2.3"
            />
          </svg>
          Импорт
        </button>
        <button id="btnBackups">Версии</button>
        <input
          type="file"
          id="fileImport"
          accept="application/json,.json"
          hidden
        />
      </div>
    </div>

    <nav class="tabs" id="tabs"></nav>

    <main class="board" id="board"></main>

    <!-- Модалка: релиз -->
    <div class="modal-back" id="mRelease">
      <div class="modal">
        <div class="modal-h">
          <span id="relTitle">Новый релиз</span
          ><button class="ghost x" data-close>✕</button>
        </div>
        <div class="modal-b">
          <label class="field"
            >Номер релиза
            <input type="text" id="rNum" placeholder="например, 3.14" />
          </label>
          <div class="row2">
            <label class="field"
              >Дата начала
              <input type="date" id="rStart" />
            </label>
            <label class="field"
              >Дата окончания
              <input type="date" id="rEnd" />
            </label>
          </div>
          <div class="hint">
            Строки таблицы будут построены по всем дням от начала до окончания
            включительно.
          </div>
          <div class="err" id="rErr"></div>
        </div>
        <div class="modal-f">
          <button class="danger" id="rDelete" style="display: none">
            Удалить релиз
          </button>
          <span class="spacer"></span>
          <button data-close>Отмена</button>
          <button class="primary" id="rSave">Подтвердить</button>
        </div>
      </div>
    </div>

    <!-- Модалка: задача -->
    <div class="modal-back" id="mTask">
      <div class="modal">
        <div class="modal-h">
          <span id="taskTitle">Новая задача</span
          ><button class="ghost x" data-close>✕</button>
        </div>
        <div class="modal-b">
          <label class="field"
            >Исполнитель
            <select id="tPerson"></select>
          </label>
          <div class="row2">
            <label class="field"
              >Тип
              <select id="tType">
                <option value="task">Задача</option>
                <option value="vacation">Отпуск</option>
                <option value="sick">Больничный</option>
              </select>
            </label>
            <label class="field"
              >Номер задачи
              <input type="text" id="tNum" placeholder="SPEKTR-1234" />
            </label>
          </div>
          <div class="row2">
            <label class="field"
              >Дата начала работы
              <input type="date" id="tStart" />
            </label>
            <label class="field"
              ><span id="tDaysLabel">Рабочих дней</span>
              <input type="number" id="tDays" step="0.5" min="0.5" value="1" />
            </label>
          </div>
          <label class="check" id="tWeekendWrap">
            <input type="checkbox" id="tWeekend" />
            <span>Работа в выходные</span>
          </label>
          <label class="field"
            >Описание
            <textarea
              id="tDesc"
              rows="1"
              maxlength="500"
              placeholder="Краткое описание работы"
            ></textarea>
            <span class="counter" id="tDescCount">0 / 500</span>
          </label>
          <div class="err" id="tErr"></div>
        </div>
        <div class="modal-f">
          <button class="danger" id="tDelete" style="display: none">
            Удалить
          </button>
          <span class="spacer"></span>
          <button data-close>Отмена</button>
          <button class="primary" id="tSave">Добавить</button>
        </div>
      </div>
    </div>

    <!-- Модалка: сотрудники -->
    <div class="modal-back" id="mPeople">
      <div class="modal">
        <div class="modal-h">
          Сотрудники отдела<button class="ghost x" data-close>✕</button>
        </div>
        <div class="modal-b">
          <div class="plist" id="plist"></div>
          <button id="pAdd">+ Добавить сотрудника</button>
          <div class="hint">Изменения сохраняются сразу.</div>
        </div>
        <div class="modal-f">
          <span class="spacer"></span
          ><button class="primary" data-close>Готово</button>
        </div>
      </div>
    </div>

    <!-- Модалка: версии (автобэкапы) -->
    <div class="modal-back" id="mBackups">
      <div class="modal">
        <div class="modal-h">
          Версии данных<button class="ghost x" data-close>✕</button>
        </div>
        <div class="modal-b">
          <div class="hint" id="bkHint">Загрузка…</div>
          <div class="bklist" id="bklist"></div>
        </div>
        <div class="modal-f">
          <span class="spacer"></span
          ><button class="primary" data-close>Закрыть</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/release.js"></script>
    <script src="js/task.js"></script>
    <script src="js/people.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/board.js"></script>
    <script src="js/data-io.js"></script>
    <script src="js/keepalive.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
